<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idol Weverse Archive</title>
  <!-- Sử dụng Tailwind CSS để giao diện đẹp và chuẩn mobile -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen bg-gray-50 pb-10 shadow-lg">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200 p-4 text-center">
    <h1 class="text-lg font-bold text-gray-800">Weverse Archive</h1>
    <p class="text-xs text-gray-500">Bản lưu trữ siêu nhẹ cho iPhone</p>
  </header>

  <!-- Feed bài viết -->
  <main id="feed" class="p-3 space-y-4">
    <div class="text-center py-10 text-gray-400" id="loading">Đang tải bài viết...</div>
  </main>

  <script>
    // ==============================================================
    // ĐIỀN THÔNG TIN SUPABASE CỦA BẠN VÀO ĐÂY:
    // ==============================================================
    const SUPABASE_URL = "https://ucbbgynudasmytiiuvxs.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_aGnvbv0tRpxXfDNj3NOFfw_GrFnsyFd"; // Dùng khóa 'anon' công khai nhé!

    async function fetchPosts() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/weverse_posts?select=*&order=created_at.desc`, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        });
        const posts = await res.json();
        
        const feed = document.getElementById('feed');
        feed.innerHTML = '';

        if (!posts || posts.length === 0) {
          feed.innerHTML = '<div class="text-center py-10 text-gray-400">Chưa có bài viết nào trong kho.</div>';
          return;
        }

        posts.forEach(post => {
          // Xử lý hiển thị ảnh
          let photosHtml = '';
          if (post.photos && post.photos.length > 0) {
            photosHtml = `<div class="grid grid-cols-${post.photos.length === 1 ? '1' : '2'} gap-1 mt-3 rounded-xl overflow-hidden">
              ${post.photos.map(url => `<img src="${url}" class="w-full h-48 object-cover cursor-pointer hover:opacity-90" onclick="window.open('${url}', '_blank')">`).join('')}
            </div>`;
          }

          const card = `
            <article class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
              <div class="flex items-center gap-2 mb-2">
                <div class="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold text-sm">
                  ${post.author ? post.author.charAt(0) : 'I'}
                </div>
                <div>
                  <h2 class="font-semibold text-gray-900 text-sm">${post.author || 'Idol'}</h2>
                  <span class="text-xs text-gray-400">${new Date(post.created_at).toLocaleString('vi-VN')}</span>
                </div>
              </div>
              
              ${post.content ? `<p class="text-gray-800 text-sm whitespace-pre-line leading-relaxed">${post.content}</p>` : ''}
              ${photosHtml}
            </article>
          `;
          feed.innerHTML += card;
        });

      } catch (err) {
        document.getElementById('feed').innerHTML = '<div class="text-center text-red-500">Lỗi tải dữ liệu.</div>';
      }
    }

    fetchPosts();
  </script>
</body>
</html>
